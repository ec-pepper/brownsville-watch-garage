<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brownsville Watch Garage Manager</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            visibility: hidden;
        }
    </style>
</head>

<body>

    <header>
        <h1>Brownsville Watch Garage</h1>
        <p>Manager Dashboard</p>
        <button type="button" id="logout-button">Log Out</button>
    </header>

    <main>
        <section>
            <h2>Add New Watch</h2>

            <form id="watch-form">
                <label for="brand">Brand</label><br>
                <input
                    type="text"
                    id="brand"
                    name="brand"
                    placeholder="BRAND"
                    required
                ><br><br>

                <label for="model">Model</label><br>
                <input
                    type="text"
                    id="model"
                    name="model"
                    placeholder="MODEL"
                    required
                ><br><br>

                <label for="price">Price ($)</label><br>
                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="$$$"
                    min="0"
                    step="0.01"
                    required
                ><br><br>

                <label for="description">Description</label><br>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Watch description"
                ></textarea><br><br>

                <label for="watch-image">Watch Image</label><br>
                <input
                    type="file"
                    id="watch-image"
                    name="watch-image"
                    accept="image/*"
                ><br><br>

                <img
                    id="image-preview"
                    src="images/no-image.png"
                    alt="Watch image preview"
                    width="180"
                ><br><br>

                <button type="submit">Add Watch</button>

                <p id="form-status" role="status"></p>
            </form>
        </section>

        <hr>

        <section>
            <h2>Current Inventory</h2>

            <div id="inventory-list">
                <p id="inventory-empty">
                    No watches in inventory yet.
                </p>
            </div>
        </section>
    </main>

    <script type="module">
        import { createClient } from
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const SUPABASE_URL =
            "https://bgqfxirtqraxsiqrryoi.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_2MoZxCN5_YXXs3_lRU_r9w_tKj1XRrM";

        const ALLOWED_USER_ID =
            "668c3aec-711f-4fb4-afad-317a25c3a7f7";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        async function initializeManager() {
            // Verify the signed-in user.
            const { data, error } =
                await supabase.auth.getUser();

            if (
                error ||
                !data.user ||
                data.user.id !== ALLOWED_USER_ID
            ) {
                await supabase.auth.signOut();
                window.location.replace("manager_login.html");
                return;
            }

            // Reveal the dashboard only after verification.
            document.body.style.visibility = "visible";

            // Log out.
            document.getElementById("logout-button")
                .addEventListener("click", async () => {
                    const { error } =
                        await supabase.auth.signOut();

                    if (error) {
                        alert("Unable to log out. Please try again.");
                        return;
                    }

                    window.location.replace("manager_login.html");
                });

            // Preview the selected watch image.
            const imageInput =
                document.getElementById("watch-image");

            const imagePreview =
                document.getElementById("image-preview");

            imageInput.addEventListener("change", () => {
                const file = imageInput.files[0];

                if (!file) {
                    imagePreview.src = "images/no-image.png";
                    return;
                }

                if (!file.type.startsWith("image/")) {
                    alert("Please select an image file.");
                    imageInput.value = "";
                    imagePreview.src = "images/no-image.png";
                    return;
                }

                imagePreview.src = URL.createObjectURL(file);
            });

            // Inventory saving will be connected next.
            document.getElementById("watch-form")
                .addEventListener("submit", (event) => {
                    event.preventDefault();

                    document.getElementById("form-status")
                        .textContent =
                        "Your account is verified. Inventory saving still needs to be connected.";
                });
        }

        initializeManager().catch((error) => {
            console.error(
                "Manager initialization failed:",
                error
            );

            window.location.replace("manager_login.html");
        });
    </script>

</body>
</html>
