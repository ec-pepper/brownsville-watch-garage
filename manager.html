
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brownsville Watch Garage Manager</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            visibility: hidden;
        }

        #image-previews,
        .watch-images {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 12px 0;
        }

        #image-previews img,
        .watch-images img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
        }

        .watch-card {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 16px;
            margin: 16px 0;
        }

        #form-status,
        #inventory-status {
            white-space: pre-wrap;
        }

        .delete-watch-button {
            background: #a92323;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
        }

        .delete-watch-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <header>
        <h1>Brownsville Watch Garage</h1>
        <p>Manager Dashboard</p>
        <button type="button" id="logout-button">Log Out</button>
    </header>

    <main>
        <section>
            <h2>Add New Watch</h2>

            <form id="watch-form">
                <label for="brand">Brand</label><br>
                <input
                    type="text"
                    id="brand"
                    name="brand"
                    placeholder="e.g. Seiko"
                    required
                ><br><br>

                <label for="model">Model</label><br>
                <input
                    type="text"
                    id="model"
                    name="model"
                    placeholder="e.g. SNKL45"
                    required
                ><br><br>

                <label for="price">Price ($)</label><br>
                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="e.g. 110"
                    min="0"
                    step="0.01"
                    required
                ><br><br>

                <label for="description">Description</label><br>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Condition, movement, size, details..."
                ></textarea><br><br>

                <label for="watch-images">Watch Photos (select multiple)</label><br>
                <input
                    type="file"
                    id="watch-images"
                    name="watch-images"
                    accept="image/*"
                    multiple
                >
                <p>You can select multiple photos for one watch.</p>

                <div id="image-previews"></div>

                <button type="submit" id="add-watch-button">
                    Add Watch
                </button>

                <p id="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>

        <hr>

        <section>
            <h2>Current Inventory</h2>
            <p id="inventory-status" role="status" aria-live="polite"></p>
            <div id="inventory-list">
                <p>Loading inventory...</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { createClient } from
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const SUPABASE_URL =
            "https://bgqfxirtqraxsiqrryoi.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_2MoZxCN5_YXXs3_lRU_r9w_tKj1XRrM";

        const ALLOWED_USER_ID =
            "668c3aec-711f-4fb4-afad-317a25c3a7f7";

        const BUCKET = "watch-images";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const form = document.getElementById("watch-form");
        const status = document.getElementById("form-status");
        const inventoryStatus =
            document.getElementById("inventory-status");
        const inventory = document.getElementById("inventory-list");
        const imageInput = document.getElementById("watch-images");
        const previews = document.getElementById("image-previews");
        const addButton = document.getElementById("add-watch-button");

        let authorizedUserId = null;
        let previewUrls = [];

        function clearPreviews() {
            previewUrls.forEach(url => URL.revokeObjectURL(url));
            previewUrls = [];
            previews.replaceChildren();
        }

        function showPreviews() {
            clearPreviews();

            const files = Array.from(imageInput.files || []);

            for (const file of files) {
                if (!file.type.startsWith("image/")) {
                    status.textContent =
                        "Please select image files only.";
                    imageInput.value = "";
                    clearPreviews();
                    return;
                }

                const url = URL.createObjectURL(file);
                previewUrls.push(url);

                const image = document.createElement("img");
                image.src = url;
                image.alt = "Selected watch photo preview";
                image.title = file.name;
                previews.appendChild(image);
            }

            status.textContent = files.length
                ? `${files.length} photo(s) selected.`
                : "";
        }

        imageInput.addEventListener("change", showPreviews);

        async function initializeManager() {
            const { data, error } = await supabase.auth.getUser();

            if (
                error ||
                !data.user ||
                data.user.id !== ALLOWED_USER_ID
            ) {
                await supabase.auth.signOut();
                window.location.replace("manager_login.html");
                return;
            }

            authorizedUserId = data.user.id;
            document.body.style.visibility = "visible";

            document.getElementById("logout-button")
                .addEventListener("click", async () => {
                    const { error: logoutError } =
                        await supabase.auth.signOut();

                    if (logoutError) {
                        alert("Unable to log out. Please try again.");
                        return;
                    }

                    window.location.replace("manager_login.html");
                });

            form.addEventListener("submit", saveWatch);

            await loadInventory();
        }

        async function saveWatch(event) {
            event.preventDefault();

            if (!authorizedUserId) {
                status.textContent = "Please sign in again.";
                return;
            }

            const brand =
                document.getElementById("brand").value.trim();

            const model =
                document.getElementById("model").value.trim();

            const price = Number(
                document.getElementById("price").value
            );

            const description =
                document.getElementById("description").value.trim();

            const files = Array.from(imageInput.files || []);

            if (
                !brand ||
                !model ||
                !Number.isFinite(price) ||
                price < 0
            ) {
                status.textContent =
                    "Please enter a valid brand, model, and price.";
                return;
            }

            if (files.some(file => !file.type.startsWith("image/"))) {
                status.textContent =
                    "Please select image files only.";
                return;
            }

            if (files.some(file => file.size > 8 * 1024 * 1024)) {
                status.textContent =
                    "Each photo must be 8 MB or smaller.";
                return;
            }

            addButton.disabled = true;
            status.textContent = "Uploading photos and saving watch...";

            const uploadedPaths = [];
            const imageUrls = [];

            try {
                for (const file of files) {
                    const safeName = file.name
                        .replace(/[^a-zA-Z0-9._-]/g, "_");

                    const path =
                        `${authorizedUserId}/${crypto.randomUUID()}-${safeName}`;

                    const { error: uploadError } = await supabase
                        .storage
                        .from(BUCKET)
                        .upload(path, file, {
                            cacheControl: "3600",
                            upsert: false,
                            contentType: file.type
                        });

                    if (uploadError) throw uploadError;

                    uploadedPaths.push(path);

                    const { data } = supabase
                        .storage
                        .from(BUCKET)
                        .getPublicUrl(path);

                    imageUrls.push(data.publicUrl);
                }

                const { error: insertError } = await supabase
                    .from("watches")
                    .insert({
                        brand,
                        model,
                        price,
                        description,
                        image_urls: imageUrls,
                        image_url: imageUrls[0] || null
                    });

                if (insertError) throw insertError;

                form.reset();
                clearPreviews();
                status.textContent = "Watch added successfully!";

                await loadInventory();
            } catch (error) {
                console.error("Could not save watch:", error);

                if (uploadedPaths.length) {
                    const { error: cleanupError } = await supabase
                        .storage
                        .from(BUCKET)
                        .remove(uploadedPaths);

                    if (cleanupError) {
                        console.error(
                            "Photo cleanup failed:",
                            cleanupError
                        );
                    }
                }

                status.textContent =
                    "Could not save watch: " +
                    (error.message || "Unknown error.");
            } finally {
                addButton.disabled = false;
            }
        }

        // Only remove photos belonging to this account in our bucket.
        function getOwnedStoragePath(publicUrl) {
            if (typeof publicUrl !== "string") return null;

            try {
                const parsed = new URL(publicUrl);
                const expectedOrigin = new URL(SUPABASE_URL).origin;
                const prefix =
                    "/storage/v1/object/public/" + BUCKET + "/";

                if (
                    parsed.origin !== expectedOrigin ||
                    !parsed.pathname.startsWith(prefix)
                ) {
                    return null;
                }

                const path = decodeURIComponent(
                    parsed.pathname.slice(prefix.length)
                );

                if (!path.startsWith(authorizedUserId + "/")) {
                    return null;
                }

                return path;
            } catch {
                return null;
            }
        }

        async function deleteWatch(watch, button) {
            if (!authorizedUserId) {
                alert("Please sign in again.");
                return;
            }

            const confirmed = window.confirm(
                `Delete ${watch.brand} ${watch.model} from inventory?\n\n` +
                "This permanently removes the inventory listing. " +
                "This action cannot be undone."
            );

            if (!confirmed) return;

            button.disabled = true;
            button.textContent = "Deleting...";

            try {
                // Delete only the selected record. RLS must authorize it.
                const { data: deletedRows, error: deleteError } =
                    await supabase
                        .from("watches")
                        .delete()
                        .eq("id", watch.id)
                        .select("id");

                if (deleteError) throw deleteError;

                if (!deletedRows || deletedRows.length === 0) {
                    throw new Error(
                        "No watch was deleted. Check your database delete policy."
                    );
                }

                // Remove only photo objects owned by this account.
                const urls = [
                    ...(Array.isArray(watch.image_urls)
                        ? watch.image_urls
                        : []),
                    watch.image_url
                ].filter(Boolean);

                const paths = [...new Set(
                    urls.map(getOwnedStoragePath).filter(Boolean)
                )];

                let photoWarning = "";

                if (paths.length) {
                    const { error: photoError } = await supabase
                        .storage
                        .from(BUCKET)
                        .remove(paths);

                    if (photoError) {
                        console.error(
                            "Watch deleted, but photo cleanup failed:",
                            photoError
                        );
                        photoWarning =
                            " The listing was deleted, but some photos could not be removed.";
                    }
                }

                inventoryStatus.textContent =
                    `${watch.brand} ${watch.model} deleted.` +
                    photoWarning;

                await loadInventory();
            } catch (error) {
                console.error("Could not delete watch:", error);

                inventoryStatus.textContent =
                    "Could not delete watch: " +
                    (error.message || "Unknown error.");

                button.disabled = false;
                button.textContent = "Delete Watch";
            }
        }

        async function loadInventory() {
            inventory.replaceChildren();
            inventoryStatus.textContent = "Loading inventory...";

            const { data: watches, error } = await supabase
                .from("watches")
                .select("*")
                .order("created_at", { ascending: false });

            if (error) {
                console.error("Inventory load failed:", error);
                inventoryStatus.textContent =
                    "Could not load inventory: " + error.message;
                return;
            }

            if (!watches || watches.length === 0) {
                inventoryStatus.textContent =
                    "No watches in inventory yet.";
                return;
            }

            inventoryStatus.textContent = "";

            for (const watch of watches) {
                const card = document.createElement("article");
                card.className = "watch-card";

                const heading = document.createElement("h3");
                heading.textContent = `${watch.brand} ${watch.model}`;

                const price = document.createElement("p");
                price.textContent =
                    "$" + Number(watch.price).toFixed(2);

                const description = document.createElement("p");
                description.textContent = watch.description || "";

                card.append(heading, price, description);

                const urls = Array.isArray(watch.image_urls)
                    ? [...new Set(watch.image_urls.filter(Boolean))]
                    : [];

                if (urls.length === 0 && watch.image_url) {
                    urls.push(watch.image_url);
                }

                if (urls.length) {
                    const gallery = document.createElement("div");
                    gallery.className = "watch-images";

                    for (const url of urls) {
                        const image = document.createElement("img");
                        image.src = url;
                        image.alt = `${watch.brand} ${watch.model}`;
                        image.loading = "lazy";
                        gallery.appendChild(image);
                    }

                    card.appendChild(gallery);
                }

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-watch-button";
                deleteButton.textContent = "Delete Watch";

                deleteButton.addEventListener("click", () => {
                    deleteWatch(watch, deleteButton);
                });

                card.appendChild(deleteButton);
                inventory.appendChild(card);
            }
        }

        initializeManager().catch(error => {
            console.error("Manager initialization failed:", error);
            window.location.replace("manager_login.html");
        });
    </script>
</body>
</html>
