<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brownsville Watch Garage Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Brownsville Watch Garage</h1>
        <p>Manager Dashboard</p>
        <button type="button" id="logout-button">Log Out</button>
    </header>

    <main>

        <section>
            <h2>Add New Watch</h2>

            <form id="watch-form">

                <label for="brand">Brand</label><br>
                <input
                    type="text"
                    id="brand"
                    name="brand"
                    placeholder="BRAND"
                    required
                ><br><br>

                <label for="model">Model</label><br>
                <input
                    type="text"
                    id="model"
                    name="model"
                    placeholder="MODEL"
                    required
                ><br><br>

                <label for="price">Price ($)</label><br>
                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="$$$"
                    min="0"
                    step="0.01"
                    required
                ><br><br>

                <label for="description">Description</label><br>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Watch description"
                ></textarea><br><br>

                <label for="watch-image">Watch Image</label><br>
                <input
                    type="file"
                    id="watch-image"
                    name="watch-image"
                    accept="image/*"
                ><br><br>

                <img
                    id="image-preview"
                    src="images/no-image.png"
                    alt="Watch image preview"
                    width="180"
                ><br><br>

                <button type="submit">Add Watch</button>

                <p id="form-status" role="status"></p>

            </form>
        </section>

        <hr>

        <section>
            <h2>Current Inventory</h2>

            <div id="inventory-list">
                <p id="inventory-empty">
                    No watches in inventory yet.
                </p>
            </div>
        </section>

    </main>

    <script type="module">
        import { createClient } from
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const SUPABASE_URL = "https://bgqfxirtqraxsiqrryoi.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_2MoZxCN5_YXXs3_lRU_r9w_tKj1XRrM";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        // Check whether the visitor has a Supabase session.
        const { data: sessionData, error: sessionError } =
            await supabase.auth.getSession();

        if (sessionError || !sessionData.session) {
            window.location.replace("manager_login.html");
        }

        // Log out of the manager dashboard.
        document.getElementById("logout-button")
            .addEventListener("click", async () => {
                const { error } = await supabase.auth.signOut();

                if (error) {
                    alert("Unable to log out. Please try again.");
                    return;
                }

                window.location.replace("manager_login.html");
            });

        // Preview the selected watch image.
        const imageInput = document.getElementById("watch-image");
        const imagePreview = document.getElementById("image-preview");

        imageInput.addEventListener("change", () => {
            const file = imageInput.files[0];

            if (file) {
                if (!file.type.startsWith("image/")) {
                    alert("Please select an image file.");
                    imageInput.value = "";
                    return;
                }

                imagePreview.src = URL.createObjectURL(file);
            } else {
                imagePreview.src = "images/no-image.png";
            }
        });

        // Watch submission will be connected to your database next.
        document.getElementById("watch-form")
            .addEventListener("submit", (event) => {
                event.preventDefault();

                document.getElementById("form-status").textContent =
                    "The form is ready. Configure your Supabase inventory table and image storage to save watches.";
            });
    </script>

</body>
</html>
